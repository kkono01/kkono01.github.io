<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>かんたん表計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#176b45;color:white;padding:16px 20px}h1{font-size:1.25rem;margin:0 0 4px}header p{margin:0;font-size:.9rem}main{max-width:1200px;margin:18px auto;padding:0 14px}.toolbar,.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;padding:12px;border:1px solid #d0d7de}.toolbar{border-radius:10px 10px 0 0}button,.filelabel{font:inherit;font-size:.9rem;padding:8px 11px;border:1px solid #c4cbd2;border-radius:6px;background:white;cursor:pointer}button:hover,.filelabel:hover{background:#f0f3f6}.primary{background:#176b45;color:white;border-color:#176b45}#file{display:none}.formula{border-top:0}#ref{width:65px;text-align:center;font-weight:bold;padding:7px;background:#f6f8fa;border:1px solid #d0d7de;border-radius:5px}#formula{flex:1;min-width:120px;padding:7px;border:1px solid #d0d7de;border-radius:5px;font:inherit}.wrap{overflow:auto;max-height:65vh;background:white;border:1px solid #d0d7de;border-top:0}table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%}th,td{border-right:1px solid #d8dee4;border-bottom:1px solid #d8dee4;height:34px;min-width:110px}th{background:#f6f8fa;text-align:center;font-weight:600;position:sticky;top:0;z-index:2}th.corner,th.rowhead{min-width:44px;width:44px}th.corner{left:0;z-index:4}th.rowhead{position:sticky;left:0;z-index:1}td{padding:0}td input{width:100%;height:33px;border:0;padding:5px 8px;font:inherit;background:transparent;outline:none}td input:focus{box-shadow:inset 0 0 0 2px #2188ff;background:#f7fbff}.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#57606a;font-size:.85rem;padding:10px 2px}.help{background:white;border:1px solid #d0d7de;border-radius:8px;padding:14px 16px;margin-top:12px;font-size:.9rem;line-height:1.6}.help code{background:#f6f8fa;padding:2px 5px;border-radius:4px}@media(max-width:600px){header{padding:13px 15px}.toolbar button,.filelabel{padding:7px 9px}.wrap{max-height:58vh}}
</style></head><body>
<header><h1>かんたん表計算</h1><p>ブラウザだけで動く、シンプルなExcel風スプレッドシート</p></header>
<main><section class="toolbar">
<button class="primary" id="new">新規シート</button><button id="addrow">行を追加</button><button id="addcol">列を追加</button><button id="export">CSVをダウンロード</button><label class="filelabel" for="file">CSVを読み込む</label><input id="file" type="file" accept=".csv,text/csv"><button id="clear">内容をクリア</button>
</section><section class="formula"><span id="ref">A1</span><span>fx</span><input id="formula" aria-label="選択セルの値または数式" placeholder="値または数式（例：=SUM(A1:A5)）"></section>
<div class="wrap"><table id="sheet"></table></div><div class="status"><span id="selstatus">セル A1 を選択中</span><span id="sumstatus">選択セルの計算結果: 空欄</span></div>
<section class="help"><strong>使い方</strong><br>セルをクリックして入力できます。数式は <code>=A1+B1</code>、<code>=SUM(A1:A5)</code>、<code>=AVERAGE(A1:A5)</code>、<code>=MAX(A1:A5)</code>、<code>=MIN(A1:A5)</code> に対応しています。Enterで下のセル、Tabで右のセルへ移動します。<br>CSVはUTF-8で読み書きします。データはサーバーに送信されません。ページ再読み込み前にCSVをダウンロードしてください。</section></main>
<script>
(()=> {
let rows=20,cols=10,data=Array.from({length:rows},()=>Array(cols).fill("")),selected={r:0,c:0};
const $=id=>document.getElementById(id),sheet=$("sheet"),formula=$("formula");
function colName(n){let s="";while(n>=0){s=String.fromCharCode(n%26+65)+s;n=Math.floor(n/26)-1}return s}
function addr(r,c){return colName(c)+(r+1)}
function parseAddr(a){let m=/^([A-Z]+)([1-9]\d*)$/i.exec(a.trim());if(!m)throw Error("セル参照が正しくありません");let c=0;for(let x of m[1].toUpperCase())c=c*26+x.charCodeAt(0)-64;return {r:+m[2]-1,c:c-1}}
function ensure(r,c){while(data.length<=r){data.push(Array(cols).fill(""));rows++}if(c>=cols){cols=c+1;data.forEach(row=>{while(row.length<cols)row.push("")})}}
function raw(r,c){return data[r]?.[c]??""}
function num(v){if(v===""||v==null)return 0;let n=Number(v);return Number.isFinite(n)?n:0}
function range(s){let p=s.split(":").map(x=>parseAddr(x.trim())),a=p[0],b=p[1]||p[0],out=[];for(let r=Math.min(a.r,b.r);r<=Math.max(a.r,b.r);r++)for(let c=Math.min(a.c,b.c);c<=Math.max(a.c,b.c);c++)out.push([r,c]);if(out.length>10000)throw Error("範囲が大きすぎます");return out}
function cell(r,c,stack=new Set()){let k=r+","+c;if(stack.has(k))throw Error("循環参照");let v=raw(r,c);if(typeof v!=="string"||!v.startsWith("=")){if(v==="")return "";let n=Number(v);return v.trim()!==""&&Number.isFinite(n)?n:v}stack.add(k);try{return expr(v.slice(1),stack)}finally{stack.delete(k)}}
function expr(input,stack){let s=input.toUpperCase();s=s.replace(/\b(SUM|AVERAGE|MAX|MIN)\s*\(\s*([A-Z]+\d+(?:\s*:\s*[A-Z]+\d+)?)\s*\)/g,(_,fn,rng)=>{let vs=range(rng).map(([r,c])=>num(cell(r,c,new Set(stack))));if(fn==="SUM")return ""+vs.reduce((a,b)=>a+b,0);if(fn==="AVERAGE")return ""+(vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:0);if(fn==="MAX")return ""+(vs.length?Math.max(...vs):0);return ""+(vs.length?Math.min(...vs):0)});
s=s.replace(/\b([A-Z]+[1-9]\d*)\b/g,ref=>{let p=parseAddr(ref),v=cell(p.r,p.c,new Set(stack));if(typeof v==="string"&&v!=="")throw Error(ref+" は数値ではありません");return ""+num(v)});
if(!/^[\d+\-*/().\seE]+$/.test(s))throw Error("未対応の数式です");
let tokens=s.match(/\d+(?:\.\d+)?(?:e[+\-]?\d+)?|[()+\-*/]/gi)||[];if(tokens.join("").replace(/\s/g,"")!==s.replace(/\s/g,""))throw Error("数式を解析できません");let i=0;
function factor(){let t=tokens[i++];if(t==="+")return factor();if(t==="-")return-factor();if(t==="("){let v=sum();if(tokens[i++]!==")")throw Error("括弧が一致しません");return v}if(t===undefined||!/^\d/.test(t))throw Error("数式を解析できません");return Number(t)}
function term(){let v=factor();while(tokens[i]==="*"||tokens[i]==="/"){let op=tokens[i++],b=factor();v=op==="*"?v*b:v/b}return v}
function sum(){let v=term();while(tokens[i]==="+"||tokens[i]==="-"){let op=tokens[i++],b=term();v=op==="+"?v+b:v-b}return v}
let result=sum();if(i!==tokens.length||!Number.isFinite(result))throw Error("計算できません");return result}
function shown(r,c){try{let v=cell(r,c);return v===""?"":""+v}catch(e){return "#ERROR!"}}
function render(){let thead=document.createElement("thead"),hr=document.createElement("tr"),corner=document.createElement("th");corner.className="corner";hr.append(corner);for(let c=0;c<cols;c++){let th=document.createElement("th");th.textContent=colName(c);hr.append(th)}thead.append(hr);let tbody=document.createElement("tbody");
for(let r=0;r<rows;r++){let tr=document.createElement("tr"),th=document.createElement("th");th.className="rowhead";th.textContent=r+1;tr.append(th);for(let c=0;c<cols;c++){let td=document.createElement("td"),inp=document.createElement("input");inp.type="text";inp.spellcheck=false;inp.dataset.r=r;inp.dataset.c=c;inp.setAttribute("aria-label",addr(r,c));inp.value=shown(r,c);inp.addEventListener("focus",()=>select(r,c,false));inp.addEventListener("change",()=>{data[r][c]=inp.value;render()});inp.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();if(e.key==="Enter"){if(r+1>=rows){rows++;data.push(Array(cols).fill(""))}select(r+1,c,true)}else{let nr=r,nc=c+1;if(nc>=cols){nc=0;nr++;if(nr>=rows){rows++;data.push(Array(cols).fill(""))}}select(nr,nc,true)}}});td.append(inp);tr.append(td)}tbody.append(tr)}sheet.replaceChildren(thead,tbody);updateBar()}
function select(r,c,focus){ensure(r,c);selected={r,c};updateBar();if(focus){let el=sheet.querySelector(`input[data-r="${r}"][data-c="${c}"]`);if(!el){render();el=sheet.querySelector(`input[data-r="${r}"][data-c="${c}"]`)}el?.focus()}}
function updateBar(){$("ref").textContent=addr(selected.r,selected.c);formula.value=raw(...[selected.r,selected.c]);$("selstatus").textContent="セル "+addr(selected.r,selected.c)+" を選択中";try{let v=cell(selected.r,selected.c);$("sumstatus").textContent="選択セルの計算結果: "+(v===""?"空欄":v)}catch(e){$("sumstatus").textContent="計算エラー: "+e.message}}
formula.addEventListener("change",()=>{ensure(selected.r,selected.c);data[selected.r][selected.c]=formula.value;render()});formula.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();formula.blur()}});
$("new").onclick=()=>{if(confirm("現在の内容を破棄して新規シートを作成しますか？")){rows=20;cols=10;data=Array.from({length:rows},()=>Array(cols).fill(""));selected={r:0,c:0};render()}};
$("addrow").onclick=()=>{rows++;data.push(Array(cols).fill(""));render()};$("addcol").onclick=()=>{cols++;data.forEach(row=>row.push(""));render()};
$("clear").onclick=()=>{if(confirm("すべてのセルの内容を消去しますか？")){data=Array.from({length:rows},()=>Array(cols).fill(""));selected={r:0,c:0};render()}};
function csvEscape(v){v=""+(v??"");return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$("export").onclick=()=>{let csv=data.map(row=>row.map(csvEscape).join(",")).join("\r\n"),blob=new Blob(["\uFEFF",csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="spreadsheet.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function parseCSV(text){text=text.replace(/^\uFEFF/,"");let out=[],row=[],field="",q=false;for(let i=0;i<text.length;i++){let ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')q=false;else field+=ch}else if(ch==='"'&&field==="")q=true;else if(ch===","){row.push(field);field=""}else if(ch==="\n"){row.push(field.replace(/\r$/,""));out.push(row);row=[];field=""}else field+=ch}row.push(field.replace(/\r$/,""));out.push(row);if(out.length&&out[out.length-1].length===1&&out[out.length-1][0]===""&&text.endsWith("\n"))out.pop();return out}
$("file").addEventListener("change",async e=>{let f=e.target.files[0];if(!f)return;try{let parsed=parseCSV(await f.text());cols=Math.max(1,...parsed.map(r=>r.length));rows=Math.max(1,parsed.length);data=parsed.map(r=>Array.from({length:cols},(_,i)=>r[i]??""));selected={r:0,c:0};render()}catch(err){alert("CSVを読み込めませんでした: "+err.message)}finally{e.target.value=""}});
render();
})();
</script></body></html>

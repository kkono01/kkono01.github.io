<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webソースビューア</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#26334d;--text:#e8eefb;--muted:#9aabc7;--accent:#79a7ff;--good:#70dfb0;--bad:#ff9a9a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1020,#10192b);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1120px;margin:auto;padding:32px 18px 50px}.hero{margin-bottom:24px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:8px 0 10px;letter-spacing:-.03em}.sub{color:var(--muted);max-width:760px;margin:0}
.panel{background:rgba(18,26,45,.94);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 16px 40px #0002}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 8px}
.formrow{display:flex;gap:10px}.url{flex:1;min-width:0;background:#080e1c;border:1px solid #344361;color:var(--text);border-radius:10px;padding:14px;font:inherit;outline:none}.url:focus{border-color:var(--accent);box-shadow:0 0 0 3px #79a7ff22}
button{font:inherit;font-weight:700;border:1px solid #3c5684;border-radius:10px;padding:12px 16px;background:#23467d;color:white;cursor:pointer}button:hover{filter:brightness(1.13)}button:disabled{opacity:.55;cursor:wait}.secondary{background:#17233a;border-color:#344361}.note{font-size:12px;color:var(--muted);margin:12px 0 0}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 10px}.pill{font-size:12px;border:1px solid var(--line);background:#0a1222;border-radius:999px;padding:5px 10px;color:var(--muted)}.pill.ok{color:var(--good);border-color:#286a58}.pill.err{color:var(--bad);border-color:#79434a}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:16px 0 10px}.tabs{display:flex;gap:6px}.tab{padding:8px 12px;background:transparent;border-color:var(--line);color:var(--muted)}.tab.active{background:#20385e;color:#fff;border-color:#456aa4}
.output{overflow:auto;max-height:65vh;background:#070b14;border:1px solid var(--line);border-radius:12px;min-height:260px}.source{margin:0;padding:16px;white-space:pre;tab-size:2;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d8e5ff;overflow:visible}.empty{padding:28px;color:var(--muted);text-align:center}.error{color:var(--bad)}.footer{color:var(--muted);font-size:12px;margin:18px 2px 0}.hidden{display:none!important}
@media(max-width:620px){main{padding:24px 12px}.panel{padding:13px}.formrow{flex-direction:column}.formrow button{width:100%}.tools{align-items:stretch}.tabs{width:100%}.tab{flex:1}.output{max-height:60vh}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="eyebrow">DEVELOPER TOOL</div>
    <h1>Webソースビューア</h1>
    <p class="sub">URLを入力して、Webページが返すHTMLソースを確認。取得した内容のコピー・保存にも対応します。</p>
  </header>
  <section class="panel">
    <form id="fetchForm">
      <label for="urlInput">確認したいページのURL</label>
      <div class="formrow">
        <input id="urlInput" class="url" type="url" placeholder="https://example.com/" autocomplete="url" required>
        <button id="fetchBtn" type="submit">ソースを取得</button>
      </div>
    </form>
    <p class="note">公開Webページ専用です。ログイン後のページやアクセス制限のあるサイトは取得できない場合があります。</p>
    <div id="status" class="status"><span class="pill">待機中</span></div>
    <div class="tools">
      <div class="tabs">
        <button class="tab active" id="rawTab" type="button">HTMLソース</button>
        <button class="tab" id="textTab" type="button">テキスト表示</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="secondary" id="copyBtn" type="button" disabled>コピー</button>
        <button class="secondary" id="saveBtn" type="button" disabled>保存</button>
      </div>
    </div>
    <div class="output"><pre id="output" class="source empty">ここに取得したソースコードが表示されます。</pre></div>
    <p class="footer">取得には公開CORSプロキシを利用します。入力したURLはプロキシ経由でリクエストされます。機密URLや個人情報を含むURLは入力しないでください。</p>
  </section>
</main>
<script>
(() => {
  const form = document.getElementById('fetchForm');
  const input = document.getElementById('urlInput');
  const fetchBtn = document.getElementById('fetchBtn');
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const copyBtn = document.getElementById('copyBtn');
  const saveBtn = document.getElementById('saveBtn');
  const rawTab = document.getElementById('rawTab');
  const textTab = document.getElementById('textTab');
  let source = '';
  let shown = 'raw';
  let currentUrl = '';

  function setStatus(items, type='') {
    status.replaceChildren();
    items.forEach((item, i) => {
      const el = document.createElement('span');
      el.className = 'pill' + (i === 0 && type ? ' ' + type : '');
      el.textContent = item;
      status.appendChild(el);
    });
  }
  function showOutput() {
    output.classList.remove('empty','error');
    if (!source) {
      output.classList.add('empty');
      output.textContent = 'ここに取得したソースコードが表示されます。';
      return;
    }
    if (shown === 'raw') {
      output.textContent = source;
    } else {
      try {
        const doc = new DOMParser().parseFromString(source, 'text/html');
        output.textContent = (doc.body?.innerText || doc.documentElement?.textContent || '').trim() || '表示できるテキストがありません。';
      } catch {
        output.textContent = source;
      }
    }
  }
  function setTab(mode) {
    shown = mode;
    rawTab.classList.toggle('active', mode === 'raw');
    textTab.classList.toggle('active', mode === 'text');
    showOutput();
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    let url;
    try {
      url = new URL(input.value.trim());
      if (!['http:', 'https:'].includes(url.protocol)) throw new Error('http/https only');
      if (url.username || url.password) throw new Error('credentials in URL');
    } catch {
      setStatus(['URLを確認してください', 'http:// または https:// のURLを入力してください'], 'err');
      return;
    }
    source = '';
    currentUrl = url.href;
    copyBtn.disabled = saveBtn.disabled = true;
    output.className = 'source empty';
    output.textContent = '取得中です…';
    setStatus(['取得中', url.hostname]);
    fetchBtn.disabled = true;
    fetchBtn.textContent = '取得中…';
    try {
      const response = await fetch('https://proxy.cors.dev/' + url.href, {
        method: 'GET',
        credentials: 'omit',
        redirect: 'follow'
      });
      const body = await response.text();
      if (!response.ok) {
        const proxyError = response.headers.get('X-Cors-Error');
        throw new Error('HTTP ' + response.status + (proxyError ? ' (' + proxyError + ')' : '') + '\n' + body.slice(0, 500));
      }
      source = body;
      if (!source) throw new Error('取得した本文が空でした。');
      copyBtn.disabled = saveBtn.disabled = false;
      setStatus(['取得成功', 'HTTP ' + response.status, source.length.toLocaleString() + ' 文字', url.hostname], 'ok');
      setTab('raw');
    } catch (err) {
      output.className = 'source error';
      output.textContent = '取得できませんでした。\n\n' + (err?.message || String(err)) +
        '\n\n考えられる原因：サイト側のアクセス制限、プロキシの制限、タイムアウト、または通信エラー。';
      setStatus(['取得失敗', url.hostname], 'err');
    } finally {
      fetchBtn.disabled = false;
      fetchBtn.textContent = 'ソースを取得';
    }
  });
  rawTab.addEventListener('click', () => setTab('raw'));
  textTab.addEventListener('click', () => setTab('text'));
  copyBtn.addEventListener('click', async () => {
    if (!source) return;
    try {
      await navigator.clipboard.writeText(source);
      setStatus(['ソースをクリップボードにコピーしました'], 'ok');
    } catch {
      setStatus(['コピーできませんでした。ソースを選択してコピーしてください'], 'err');
    }
  });
  saveBtn.addEventListener('click', () => {
    if (!source) return;
    const blob = new Blob([source], {type:'text/html;charset=utf-8'});
    const link = document.createElement('a');
    const safeHost = new URL(currentUrl).hostname.replace(/[^a-z0-9.-]/gi, '_');
    link.href = URL.createObjectURL(blob);
    link.download = safeHost + '-source.html';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  });
})();
</script>
</body>
</html>
